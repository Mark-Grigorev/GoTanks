services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gotanks
      POSTGRES_USER: gotanks
      POSTGRES_PASSWORD: gotanks
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gotanks"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.gotanks
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
